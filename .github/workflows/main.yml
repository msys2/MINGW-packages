name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  check-diff:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.diff-check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Branch Difference
        id: diff-check
        shell: bash
        run: |
          git fetch origin experimental --depth=2
          
          # Check if any PKGBUILD files changed between experimental~1 and experimental
          if git diff --quiet origin/experimental~1 origin/experimental -- '*/PKGBUILD' 'PKGBUILD'; then
            echo "No PKGBUILD files changed. Skipping matrix builds."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "PKGBUILD changes detected. Proceeding with builds."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-diff]
    if: ${{ needs.check-diff.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          [
            { msystem: UCRT64, runner: windows-2022 },
            { msystem: CLANG64, runner: windows-2022 },
            { msystem: MINGW64, runner: windows-2022 },
            { msystem: MINGW32, runner: windows-2022 },
            { msystem: CLANGARM64, runner: windows-11-arm },
          ]
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Gather Facts
        id: facts
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize -Wrap
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          Get-CIMInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum | Format-Table @{n="TotalPhysicalMemory";e={$_.Sum}}
          $BUILD_DRIVE = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          echo "drive=$BUILD_DRIVE" >> $env:GITHUB_OUTPUT

      - name: Configure Pagefile
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        continue-on-error: true
        shell: powershell
        run: |
          try {
            $System = Get-WmiObject -Class Win32_ComputerSystem
            $System.AutomaticManagedPagefile = $false
            $System.Put() | Out-Null
            $PageFile = Get-WmiObject -Class Win32_PageFileSetting -Filter "SettingID='pagefile.sys @ C:'"
            if (-not $PageFile) {
              $PageFile = Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{Name="C:\pagefile.sys"}
            }
            $PageFile.InitialSize = 4096
            $PageFile.MaximumSize = 16384
            $PageFile.Put() | Out-Null
          } catch {
            Write-Host "Pagefile configured with status output: $_"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          install: git python base-devel
          update: true
          location: '${{ steps.facts.outputs.drive }}\M'
          suppress-deprecation-warnings: msystem-mingw32 msystem-mingw64

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          cp /etc/pacman.conf /etc/pacman.conf.bak
          grep -qFx '[staging]' /etc/pacman.conf || sed -i '/^# \[staging\]/,/^$/ s|^# ||g' /etc/pacman.conf

      - name: Update using staging
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Move Checkout
        run: |
          $path = "${{ steps.facts.outputs.drive }}\_"
          If (Test-Path "$path") { rm -r -fo "$path" }
          Move-Item -Path ".\temp" -Destination "$path"

      - name: CI-Build
        shell: msys2 {0}
        id: build
        run: |
          cd "$(cygpath '${{ steps.facts.outputs.drive }}/_')"
          git fetch origin experimental --depth=2
          MINGW_ARCH=${{ matrix.msystem }} ./.ci/ci-build.sh

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.msystem }}-packages
          path: ${{ steps.facts.outputs.drive }}/_/artifacts/*.pkg.tar.*
          if-no-files-found: ignore

  check:
    needs: [build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: UCRT64-packages
          path: ${{ runner.temp }}/artifacts
      - name: Check whether to Run
        id: check-run
        run: |
          python .ci/ci-check.py --whether-to-run "${{ runner.temp }}/artifacts"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.check-run.outputs.run == 'true'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pacdb
      - name: Add staging repo
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf
      - name: Update using staging
        if: steps.check-run.outputs.run == 'true'
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'
      - name: Run Checks
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          python .ci/ci-check.py "${{ runner.temp }}/artifacts"

  package-grokker:
    runs-on: ubuntu-latest
    needs: build
    name: package-grokker-${{ matrix.msystem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            repo: ucrt64
          - msystem: CLANG64
            repo: clang64

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: artifacts
        continue-on-error: true
        with:
          name: ${{ matrix.msystem }}-packages
          path: artifacts
      - name: Grok packages
        uses: msys2/package-grokker/grok-artifacts@a976a49de6f306122b7b603d1212782a900fa8fd # v0.1.0
        if: steps.artifacts.outcome == 'success'
        with:
          repo: ${{ matrix.repo }}
          path: artifacts